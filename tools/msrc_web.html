<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a"><title>MSRC Link</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--line:#334155;--tx:#e2e8f0;--mu:#94a3b8;--ac:#38bdf8}
@media(prefers-color-scheme:light){:root{--bg:#f1f5f9;--card:#fff;--line:#cbd5e1;--tx:#0f172a;--mu:#64748b;--ac:#0284c7}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{display:flex;gap:8px;align-items:center;padding:10px 12px 4px}
h1{font-size:19px;margin:0;flex:1}
button{font:inherit;min-height:46px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx)}
button.p{background:var(--ac);color:#04121f;border:0;font-weight:600}
button:disabled{opacity:.4}
#st{font-size:13px;color:var(--mu);padding:0 12px 8px;min-height:22px}
nav{display:flex;border-bottom:1px solid var(--line)}
nav button{flex:1;border:0;border-radius:0;background:none;color:var(--mu);border-bottom:3px solid transparent}
nav button.on{color:var(--ac);border-color:var(--ac)}
main{flex:1;overflow:auto;padding:10px 12px}
#set.off{opacity:.45;pointer-events:none}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
summary{padding:14px;font-weight:600}
.f{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 14px;border-top:1px solid var(--line)}
.f label{flex:1;font-size:15px;word-break:break-word}
input,select{font:inherit;min-height:44px;max-width:52%;padding:0 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--tx)}
input[type=number]{width:125px;text-align:right}
input[type=checkbox]{width:28px;height:28px;min-height:0}
.nt{color:var(--mu);font-size:11px;font-weight:400}.f.nu{opacity:.6}
#log{white-space:pre-wrap;word-break:break-all;font:12px/1.35 ui-monospace,monospace;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:55vh;margin:0}
.bar{display:none;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.bar.on{display:flex}.bar button{flex:1}
#hint{color:var(--mu);font-size:14px;padding:6px 2px}
</style></head><body>
<header><h1>MSRC Link</h1><button id="bc" class="p">Verbinden</button></header>
<div id="st">Nicht verbunden</div>
<nav><button id="t1" class="on">Einstellungen</button><button id="t2">Log</button></nav>
<main>
 <div id="set" class="off"><div id="hint">Per USB-OTG-Kabel mit dem RP2040 verbinden, dann „Verbinden“ tippen. Geändert wird erst nach „Schreiben“; danach den RP2040 neu starten.</div></div>
 <pre id="log" hidden></pre>
</main>
<div class="bar on" id="b1"><button id="br" disabled>Lesen</button><button id="bw" class="p" disabled>Schreiben</button></div>
<div class="bar" id="b2"><button id="bl" class="p" disabled>Log starten</button><button id="bx">Leeren</button><button id="bk">Kopieren</button><button id="bs">Speichern</button></div>
<script>
/* Byte-Layout von config_t (include/shared.h), natürliche Ausrichtung wie ARM-GCC; gegen kompiliertes C-Struct geprüft (224 Byte) */
const FS="version:u16,rx_protocol:u8,esc_protocol:u8,enable_gps:bool,gps_baudrate:u32,enable_analog_voltage:bool,enable_analog_current:bool,enable_analog_ntc:bool,enable_analog_airspeed:bool,i2c_module:u8,ina3221_filter:u8,alpha_rpm:f32,alpha_voltage:f32,alpha_current:f32,alpha_temperature:f32,alpha_vario:f32,alpha_airspeed:f32,refresh_rate_rpm:u16,refresh_rate_voltage:u16,refresh_rate_current:u16,refresh_rate_temperature:u16,refresh_rate_gps:u16,refresh_rate_consumption:u16,refresh_rate_vario:u16,refresh_rate_airspeed:u16,refresh_rate_default:u16,analog_voltage_multiplier:f32,analog_current_type:u8,gpio_interval:u16,analog_current_quiescent_voltage:f32,analog_current_multiplier:f32,analog_current_offset:f32,analog_current_autoffset:bool,pairOfPoles:u8,mainTeeth:u8,pinionTeeth:u8,rpm_multiplier:f32,bmp280_filter:u8,enable_pwm_out:bool,smartport_sensor_id:u8,smartport_data_id:u16,vario_auto_offset:bool,xbus_clock_stretch:bool,jeti_gps_speed_units_kmh:bool,enable_esc_hw4_init_delay:bool,esc_hw4_init_delay_duration:u16,esc_hw4_current_thresold:u8,esc_hw4_current_max:u16,esc_hw4_voltage_multiplier:f32,esc_hw4_current_multiplier:f32,ibus_alternative_coordinates:bool,debug:u8,esc_hw4_is_manual_offset:bool,analog_rate:u8,xbus_use_alternative_volt_temp:bool,gpio_mask:u8,esc_hw4_offset:f32,serial_monitor_baudrate:u32,serial_monitor_stop_bits:u8,serial_monitor_parity:u8,serial_monitor_timeout_ms:u16,serial_monitor_inverted:bool,esc_hw4_auto_detect:bool,airspeed_vcc:i16,fuel_flow_ml_per_pulse:f32,enable_fuel_flow:bool,xgzp68xxd_k:u16,enable_fuel_pressure:u8,smart_esc_calc_consumption:bool,serial_monitor_gpio:u8,gps_rate:u8,serial_monitor_format:u8,gps_protocol:u8,sbus_battery_slot:bool,fport_inverted:bool,fbus_inverted:bool,airspeed_offset:i16,mpu6050_acc_scale:u8,mpu6050_gyro_scale:u8,mpu6050_gyro_weighting:u8,enable_gyro:bool,enable_lipo:u8,mpu6050_filter:u8,lipo_cells:u8,sensor_id_srxl2:u8,ntc_offset:i8,gps_dynmodel:u8,sensor_id_jeti:u8,spare81:u8,spare82:u16,"+Array.from({length:12},(_,i)=>"spare"+(i+9)+":u32").join(",");
const SZ={u8:1,i8:1,bool:1,u16:2,i16:2,u32:4,i32:4,f32:4},L={};let off=0;
for(const s of FS.split(",")){const[n,t]=s.split(":"),a=SZ[t];off=Math.ceil(off/a)*a;L[n]={o:off,t};off+=a}
const SIZE=Math.ceil(off/4)*4,buf=new Uint8Array(SIZE),dv=new DataView(buf.buffer);
const RNG={u8:[0,255],i8:[-128,127],bool:[0,1],u16:[0,65535],i16:[-32768,32767],u32:[0,4294967295],i32:[-2147483648,2147483647]};
function get(n){const{o,t}=L[n];return t=="u8"||t=="bool"?dv.getUint8(o):t=="i8"?dv.getInt8(o):t=="u16"?dv.getUint16(o,1):t=="i16"?dv.getInt16(o,1):t=="u32"?dv.getUint32(o,1):t=="i32"?dv.getInt32(o,1):dv.getFloat32(o,1)}
function set(n,v){const{o,t}=L[n];if(t=="u8"||t=="bool")dv.setUint8(o,v);else if(t=="i8")dv.setInt8(o,v);else if(t=="u16")dv.setUint16(o,v,1);else if(t=="i16")dv.setInt16(o,v,1);else if(t=="u32")dv.setUint32(o,v,1);else if(t=="i32")dv.setInt32(o,v,1);else dv.setFloat32(o,v,1)}
const avgOf=a=>a>0?Math.min(16,Math.max(1,Math.round(2/a-1))):1;   /* alpha = 2/(N+1) */
const O=a=>a.map((x,i)=>[i,x]);
//--UI--
const RX=O(["FrSky SmartPort","FrSky D","Spektrum XBUS","Spektrum SRXL","FlySky IBUS","S.Bus","Multiplex","Jeti EX Bus","Hitec","Spektrum SRXL2","Serial Monitor","CRSF","Graupner Hott","Sanwa","JR DMSS","FPort","FBUS","GHST","Jeti EX (Sensor)"]);
const ESC=O(["Keiner","HW V3","HW V4","PWM","Castle","Kontronik","APD F","APD HV","HW V5","Smart ESC","OMP M4","ZTW","OpenYGE"]);
const DYN=[[0,"0 – Portable"],[2,"2 – Stationary"],[3,"3 – Pedestrian"],[4,"4 – Automotive"],[5,"5 – Sea"],[6,"6 – Airborne <1g"],[7,"7 – Airborne <2g"],[8,"8 – Airborne <4g"],[9,"9 – Wrist"],[10,"10 – Bike"]];
const NOTE={vario_auto_offset:"nicht unterstützt",bmp280_filter:"nicht unterstützt",esc_hw4_current_thresold:"nicht unterstützt",esc_hw4_init_delay_duration:"nicht unterstützt (feste 15 s)",analog_current_type:"von der Firmware nicht ausgewertet",analog_current_quiescent_voltage:"von der Firmware nicht ausgewertet",smartport_data_id:"nicht unterstützt (fest 0x5100)",rpm_multiplier:"~wird beim Schreiben aus Polpaaren/Zähnezahlen neu berechnet",alpha_vario:"~nur bei SPL06 wirksam",alpha_rpm:"~bei HW5, Castle, PWM und Smart ESC ohne Wirkung",alpha_voltage:"~ESC-Anteil: bei HW5, Castle und Smart ESC ohne Wirkung",alpha_current:"~ESC-Anteil: bei HW5, Castle und Smart ESC ohne Wirkung",alpha_temperature:"~ESC-Anteil: bei HW5, Castle und Smart ESC ohne Wirkung",refresh_rate_consumption:"~nur FrSky D und S.Port",refresh_rate_rpm:"~nur FrSky (S.Port, F.Port, FBUS, FrSky D)",refresh_rate_voltage:"~nur FrSky (S.Port, F.Port, FBUS, FrSky D)",refresh_rate_current:"~nur FrSky (S.Port, F.Port, FBUS, FrSky D)",refresh_rate_temperature:"~nur FrSky (S.Port, F.Port, FBUS, FrSky D)",refresh_rate_gps:"~nur FrSky (S.Port, F.Port, FBUS, FrSky D)",refresh_rate_vario:"~nur FrSky (S.Port, F.Port, FBUS, FrSky D)",refresh_rate_airspeed:"~nur FrSky (S.Port, F.Port, FBUS, FrSky D)",refresh_rate_default:"~nur FrSky (S.Port, F.Port, FBUS, FrSky D)"};
const S=[
["Empfänger / ESC",[["rx_protocol","Empfänger-Protokoll","sel",RX],["esc_protocol","ESC-Protokoll","sel",ESC],["sensor_id_jeti","Jeti Sensor-ID (0–4)","num",0,4],["sensor_id_srxl2","SRXL2 Sensor-ID","num"],["smartport_sensor_id","SmartPort Sensor-ID","num"],["smartport_data_id","SmartPort Data-ID","num"],["jeti_gps_speed_units_kmh","Jeti GPS-Speed in km/h","bool"],["sbus_battery_slot","S.Bus Batterie-Slot","bool"],["fport_inverted","FPort invertiert","bool"],["fbus_inverted","FBUS invertiert","bool"]]],
["GPS",[["enable_gps","GPS aktiv","bool"],["gps_protocol","Protokoll","sel",O(["UBLOX","NMEA"])],["gps_baudrate","Baudrate","sel",[115200,57600,38400,9600].map(x=>[x,""+x])],["gps_rate","Rate (Hz)","sel",[1,5,10,20].map(x=>[x,""+x])],["gps_dynmodel","Dynamic model","sel",DYN]]],
["Vario / Barometer",[["i2c_module","Sensor","sel",O(["Keiner","BMP280","MS5611","BMP180","SPL06"])],["alpha_vario","Mittelung Vario (1–16)","avg"]]],
["Analog-Sensoren",[["enable_analog_voltage","Spannung aktiv","bool"],["analog_voltage_multiplier","Spannung Faktor","num"],["alpha_voltage","Mittelung Spannung (1–16)","avg"],["enable_analog_current","Strom aktiv","bool"],["analog_current_type","Stromsensor","sel",O(["Hall","Shunt"])],["analog_current_multiplier","Strom Faktor","num"],["alpha_current","Mittelung Strom (1–16)","avg"],["enable_analog_ntc","NTC-Temperatur aktiv","bool"],["ntc_offset","NTC Offset","num"],["alpha_temperature","Mittelung Temperatur (1–16)","avg"],["enable_analog_airspeed","Fluggeschwindigkeit aktiv","bool"],["airspeed_offset","Airspeed Offset","num"],["alpha_airspeed","Mittelung Airspeed (1–16)","avg"]]],
["Drehzahl / ESC",[["alpha_rpm","Mittelung Drehzahl (1–16)","avg"],["rpm_multiplier","Drehzahl Faktor","num"],["pairOfPoles","Polpaare","num"],["mainTeeth","Hauptzahnrad","num"],["pinionTeeth","Ritzel","num"],["smart_esc_calc_consumption","Smart ESC: Verbrauch berechnen","bool"],["enable_pwm_out","PWM-Ausgang aktiv","bool"]]],
["Aktualisierungsraten (ms)",["rpm","voltage","current","temperature","gps","consumption","airspeed","default"].map(x=>["refresh_rate_"+x,x,"num"])]];
const $=s=>document.querySelector(s),C={},used=new Set();
function mk(f){const[n,lab,k,a,b]=f;used.add(n);const w=document.createElement("div");w.className="f";const l=document.createElement("label");l.textContent=lab;if(NOTE[n]){const t=NOTE[n],q=document.createElement("small");q.className="nt";q.textContent=" – "+t.replace(/^~/,"");l.append(q);if(t[0]!="~")w.classList.add("nu")}w.append(l);let e;
 if(k=="sel"){e=document.createElement("select");a.forEach(([v,t])=>e.add(new Option(t,v)))}
 else{e=document.createElement("input");if(k=="bool")e.type="checkbox";else{e.type="number";e.inputMode="decimal";const t=L[n].t;e.step=k=="avg"||t!="f32"?1:"any";const r=k=="avg"?[1,16]:a!=null?[a,b]:RNG[t];if(r){e.min=r[0];e.max=r[1]}}}
 e.onchange=()=>put(n);w.append(e);C[n]={e,k};return w}
function put(n){const{e,k}=C[n],t=L[n].t;if(k=="sel")set(n,+e.value);else if(k=="bool")set(n,e.checked?1:0);else if(k=="avg"){const v=Math.min(16,Math.max(1,Math.round(+e.value)||1));e.value=v;set(n,2/(v+1))}else{let v=parseFloat(e.value);if(isNaN(v))return;if(t!="f32"){v=Math.round(v);const r=RNG[t];v=Math.min(r[1],Math.max(r[0],v));e.value=v}set(n,v)}}
function show(n){const{e,k}=C[n];if(k=="sel"){const v=get(n);if(![...e.options].some(o=>+o.value==v))e.add(new Option("Wert "+v,v));e.value=v}else if(k=="bool")e.checked=!!get(n);else if(k=="avg")e.value=avgOf(get(n));else{const v=get(n);e.value=L[n].t=="f32"?+v.toPrecision(7):v}}
function build(){const root=$("#set");S.forEach(([t,fs],i)=>{const d=document.createElement("details");d.open=i<2;d.innerHTML="<summary>"+t+"</summary>";fs.forEach(f=>d.append(mk(f)));root.append(d)});
 const d=document.createElement("details");d.innerHTML="<summary>Erweitert (übrige Felder)</summary>";
 Object.keys(L).filter(n=>!used.has(n)&&!/^spare|^version$/.test(n)).forEach(n=>d.append(mk([n,n,L[n].t=="bool"?"bool":"num"])));root.append(d)}
build();const showAll=()=>Object.keys(C).forEach(show);showAll();
/* ---- Seriell (Web Serial) ---- */
const H=0x30,st=m=>$("#st").textContent=m,sleep=ms=>new Promise(r=>setTimeout(r,ms));
let port,wr,rd,rx=new Uint8Array(0),logOn=false,loaded=false,waiter=null;let full=[],fullLen=0;const td=new TextDecoder();
const send=b=>wr.write(Uint8Array.from(b));
function ui(){const c=!!port;$("#bc").textContent=c?"Trennen":"Verbinden";$("#br").disabled=!c||logOn;$("#bw").disabled=!c||!loaded||logOn;$("#bl").disabled=!c;$("#bl").textContent=logOn?"Log stoppen":"Log starten";$("#set").classList.toggle("off",!loaded)}
function onData(v){if(logOn){const l=$("#log"),near=$("main").scrollHeight-$("main").scrollTop-$("main").clientHeight<80;const tx=td.decode(v,{stream:true});full.push(tx);fullLen+=tx.length;while(fullLen>20e6&&full.length>1)fullLen-=full.shift().length;l.textContent=(l.textContent+tx).slice(-60000);if(near)$("main").scrollTop=1e9;return}
 const m=new Uint8Array(rx.length+v.length);m.set(rx);m.set(v,rx.length);rx=m;
 for(let i=0;i+2+SIZE<=rx.length;i++)if(rx[i]==H&&rx[i+1]==0x32){buf.set(rx.subarray(i+2,i+2+SIZE));rx=new Uint8Array(0);if(waiter)waiter();return}}
async function loop(){const r=port.readable.getReader();rd=r;try{for(;;){const{value,done}=await r.read();if(done)break;onData(value)}}catch(e){}finally{r.releaseLock()}}
let diag="";
/* Firmware (usb.c) pollt USB nur 1x pro Sekunde und verwirft zusammengefasste Befehle -> zwischen den Befehlen >1 s warten (Qt-GUI: 2 s). Antwort kommt ca. 2 s nach dem Befehl. */
function readCfg(){return new Promise(async res=>{if(!port)return res(false);await send([H,0x34]);await sleep(2000);rx=new Uint8Array(0);
 const t=setTimeout(()=>{waiter=null;let i=-1;for(let k=0;k+1<rx.length;k++)if(rx[k]==H&&rx[k+1]==0x32){i=k;break}
  diag=rx.length+" Byte empfangen"+(i>=0?", nach dem Header "+(rx.length-i-2)+" statt "+SIZE:"");res(false)},8000);
 waiter=()=>{clearTimeout(t);waiter=null;res(true)};await send([H,0x31])})}
async function doRead(){st("Lese Konfiguration … (dauert ca. 5 s)");if(await readCfg()){loaded=true;$("#hint").hidden=true;showAll();st("Konfiguration gelesen ("+SIZE+" Byte)")}else st("Keine gültige Antwort ("+diag+"). Firmware zu alt/anders oder Port belegt.");ui()}
async function connect(){if(!("serial"in navigator)){st("Web Serial fehlt: Chrome über HTTPS verwenden (Android: Chrome 148 oder neuer, USB-OTG-Kabel).");return}
 try{port=await navigator.serial.requestPort();await port.open({baudRate:115200});try{await port.setSignals({dataTerminalReady:true,requestToSend:true})}catch(e){}wr=port.writable.getWriter();loop();ui();await doRead()}catch(e){st("Verbindung fehlgeschlagen: "+e.message);port=null;ui()}}
async function disconnect(){logOn=false;loaded=false;try{await rd?.cancel();wr?.releaseLock();await port?.close()}catch(e){}port=null;st("Getrennt");ui()}
$("#bc").onclick=()=>port?disconnect():connect();
$("#br").onclick=doRead;
$("#bw").onclick=async()=>{if(!confirm("Konfiguration auf den RP2040 schreiben?"))return;const sent=buf.slice();st("Schreibe … bitte ca. 15 s warten (Firmware speichert, LED blinkt)");await send([H,0x30,...sent]);await sleep(6000);
 const ok=await readCfg();showAll();st(ok&&sent.every((b,i)=>b==buf[i])?"Gespeichert und bestätigt. RP2040 jetzt neu starten (USB trennen/stecken).":"Gesendet, Rücklesen nicht bestätigt. Bitte erneut „Lesen“.");ui()};
$("#bl").onclick=async()=>{if(!port)return;if(!logOn){logOn=true;ui();await send([H,0x33]);st("Log läuft")}else{await send([H,0x34]);logOn=false;st("Log gestoppt");ui()}};
$("#bx").onclick=()=>{$("#log").textContent="";full=[];fullLen=0};
$("#bk").onclick=()=>navigator.clipboard?.writeText(full.join("")).then(()=>st("Log kopiert"));
function logNr(){let n=1;try{n=(parseInt(localStorage.getItem("msrcLogNr"),10)||0)+1;localStorage.setItem("msrcLogNr",n)}catch(e){n=Math.floor(Date.now()/1000)%100000}return String(n).padStart(3,"0")}
$("#bs").onclick=()=>{if(!fullLen){st("Log ist leer");return}const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([full.join("")],{type:"text/plain"}));a.download="msrc_log_"+logNr()+"_"+new Date().toISOString().slice(0,10)+".txt";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000);st("Log gespeichert ("+Math.round(fullLen/1024)+" KB)")};
function tab(n){$("#t1").classList.toggle("on",n==1);$("#t2").classList.toggle("on",n==2);$("#set").hidden=n!=1;$("#log").hidden=n!=2;$("#b1").classList.toggle("on",n==1);$("#b2").classList.toggle("on",n==2)}
$("#t1").onclick=()=>tab(1);$("#t2").onclick=()=>tab(2);
navigator.serial?.addEventListener("disconnect",()=>{if(port)disconnect()});
</script></body></html>
